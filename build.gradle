minecraft {
    mappings channel: mapping_channel, version: mapping_version
    runs {
        //开发环境
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            jvmArgs(
                    "-Xms4G",
                    "-Xmx6G",
                    "-XX:+UseG1GC",
                    "-XX:+ParallelRefProcEnabled",
                    "-XX:MaxGCPauseMillis=100",
                    "-XX:+UnlockExperimentalVMOptions",
                    "-XX:+DisableExplicitGC",
                    "-XX:G1NewSizePercent=20",
                    "-XX:G1MaxNewSizePercent=40",
                    "-XX:G1HeapRegionSize=8M",
                    "-XX:G1ReservePercent=20",
                    "-XX:InitiatingHeapOccupancyPercent=15"
            )
            mods {
                changede {
                    source sourceSets.main
                }
            }
        }
        //正式环境
        create("clientCoverage") {
            parent null, "client"
            taskName "runClientCoverage"
            workingDirectory project.file('run-coverage')
            property 'forge.logging.console.level', 'info'
        }
        create("clientJfr") {
            parent null, "client"
            taskName "runClientJfr"
            workingDirectory project.file('run-jfr')
            property 'forge.logging.console.level', 'info'
        }
        create("clientProd") {
            parent null, "client"
            taskName "runClientProd"
            workingDirectory project.file('run-prod')
            property 'forge.logging.console.level', 'info'
            environment 'MOD_CLASSES', project.file('run-prod/empty').absolutePath
            // 注意：这里不写 mods { sourceSets.main }
            // 让它从 run-prod/mods 读取打包后的 jar
        }
        create("clientProdFast") {
            parent null, "clientProd"
            taskName "runClientProdFast"
            workingDirectory project.file('run-prod-fast')
            property 'forge.logging.console.level', 'info'
            environment 'MOD_CLASSES', project.file('run-prod-fast/empty').absolutePath
        }
        create("clientFast") {
            parent null, "client"
            taskName "runClientFast"
            workingDirectory project.file('run-fast')
            property 'forge.logging.console.level', 'info'
        }
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods {
                changede {
                    source sourceSets.main
                }
            }
        }
    }
}
tasks.named('test') {
    enabled = false
}

tasks.register('verifyChangedMixinDiagnostics', JavaExec) {
    group = 'verification'
    description = 'Checks Changed-specific Mixin attribution without booting Minecraft.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'github.com.gengyoubo.CE.diagnostics.ChangedMixinDiagnosticsTest'
}
tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            displayURL: displayURL,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}
tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation"
}
def mixinRefmapDir = "${buildDir}/tmp/compileJava"
jar {
    manifest {
        attributes([
                "Specification-Title": mod_name,
                "Specification-Vendor": mod_authors,
                "Specification-Version": mod_version,
                "Implementation-Title": mod_group_id,
                "Implementation-Version": project.version,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs": "mixins/changede.mixins.json,mixins/changede-proext.mixins.json,mixins/changede-lp.mixins.json,mixins/changede-diagnostics.mixins.json"
        ])}
    // 显式包含 resources 目录下的所有文件
    from(sourceSets.main.resources) {
        include 'mixins/**'      // 包含 mixins 目录
        include 'assets/**'      // 包含 assets 目录
        include 'META-INF/**'    // 包含 META-INF 目录
    }
    // 包含编译后的 class 文件
    from(sourceSets.main.output) {
        exclude '**/*.refmap.json'  // 排除 refmap，后面单独处理
    }
    // 包含 refmap 文件（确保它在正确的位置）
    from("${buildDir}/classes/java/main") {
        include '**/*.refmap.json'
    }
    from(mixinRefmapDir) {
        include '**/*.refmap.json'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    finalizedBy 'reobfJar'

    //模组名称
    archiveBaseName.set("changed-extra")
    //模组版本
    archiveVersion.set(mod_version)
    //模组分支(主分支为main)
    //archiveClassifier.set("b")
}
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
tasks.register('devJar', Jar) {
    archiveBaseName.set("changed-extra")
    archiveVersion.set(mod_version)
    archiveClassifier.set("dev")
    from(sourceSets.main.output)
    from("${buildDir}/classes/java/main") {
        include '**/*.refmap.json'
    }
    from(mixinRefmapDir) {
        include '**/*.refmap.json'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('prepareProdRun', Copy) {
    dependsOn tasks.named('devJar')
    from(tasks.named('devJar').flatMap { it.archiveFile })
    into("$projectDir/run-prod/mods")
    doFirst {
        mkdir("$projectDir/run-prod/empty")
        delete fileTree("$projectDir/run-prod/mods") {
            include "changed-extra-*.jar"
        }
    }
}

tasks.register('prepareProdFastRun', Copy) {
    dependsOn tasks.named('devJar')
    from(tasks.named('devJar').flatMap { it.archiveFile })
    into("$projectDir/run-prod-fast/mods")
    doFirst {
        mkdir("$projectDir/run-prod-fast/empty")
        delete fileTree("$projectDir/run-prod-fast/mods") {
            include "changed-extra-*.jar"
        }
    }
}

tasks.configureEach {
    if (name.toLowerCase() == 'runclientprod') {
        dependsOn 'prepareProdRun'
    }
    if (name.toLowerCase() == 'runclientprodfast') {
        dependsOn 'prepareProdFastRun'
        doFirst {
            // Prod-jar startup benchmark profile.
            jvmArgs "-Dmixin.env.disableRefMap=true"
            jvmArgs "-Dchangede.mixin.addonLight=true"
        }
    }
    if (name.toLowerCase() == 'runclientcoverage') {
        finalizedBy 'jacocoRunClientReport'
        doFirst {
            mkdir(clientCoverageExecFile.parentFile)
            delete clientCoverageExecFile
            jvmArgs "-javaagent:${configurations.jacocoAgent.singleFile}=destfile=${clientCoverageExecFile.absolutePath},append=false,includes=github.com.gengyoubo.*:net.ltxprogrammer.changed.*:net.foxyas.changedaddon.*"
        }
    }
    if (name.toLowerCase() == 'runclientjfr') {
        doFirst {
            mkdir(startupJfrFile.parentFile)
            delete startupJfrFile
            jvmArgs "-XX:StartFlightRecording=filename=${startupJfrFile.absolutePath},dumponexit=true,settings=profile"
        }
    }
    if (name.toLowerCase() == 'runclientfast') {
        doFirst {
            // Fast-start profile for local startup benchmarking only.
            jvmArgs "-Dmixin.env.disableRefMap=true"
            jvmArgs "-Dchangede.mixin.addonLight=true"
        }
    }
}

// A running Forge client loads classes lazily. Recompiling its live classes directory
// can temporarily remove classes and poison the loader with ClassNotFoundException.
// Keep each development launch on its own merged, untracked runtime snapshot.
def createDevRunSnapshot = {
    def snapshot = file(".gradle/changede-runtime/${UUID.randomUUID()}/main")
    copy {
        from(sourceSets.main.output)
        from(mixinRefmapDir) {
            include '**/*.refmap.json'
        }
        into(snapshot)
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    def required = [
            'META-INF/mods.toml',
            'mixins/changede.mixins.json',
            'changede.refmap.json',
            'github/com/gengyoubo/CE/changede.class',
            'github/com/gengyoubo/CE/LP/client/renderer/MimicYufengWingsRenderer.class',
            'github/com/gengyoubo/CE/LP/client/renderer/MimicYufengWingsItemRenderer.class'
    ]
    required.each { path ->
        if (!new File(snapshot, path).isFile()) {
            throw new GradleException("Development runtime snapshot is missing ${path}")
        }
    }
    snapshot
}

def bindDevRunSnapshot = { runTask, snapshot ->
    def coordinates = "${mod_id}%%${snapshot.absolutePath}".toString()
    // ForgeGradle reapplies RunConfig.environment in MinecraftRunTask.exec(),
    // after doFirst. Update that config as well as JavaExec's environment.
    runTask.getRunConfig().get().environment('MOD_CLASSES', coordinates)
    runTask.environment('MOD_CLASSES', coordinates)
}

tasks.register('verifyDevRunSnapshot') {
    group = 'verification'
    description = 'Checks merged development runtime snapshots without starting Minecraft.'
    dependsOn tasks.named('classes')
    doLast {
        def first = createDevRunSnapshot()
        def second = createDevRunSnapshot()
        if (first == second) throw new GradleException('Development launches must use distinct snapshots')
        def outputFiles = sourceSets.main.output.asFileTree.files.findAll { it.isFile() }
        outputFiles.each { source ->
            def outputRoot = sourceSets.main.output.files.find { source.toPath().startsWith(it.toPath()) }
            def relative = outputRoot.toPath().relativize(source.toPath()).toString()
            if (!Arrays.equals(source.bytes, new File(first, relative).bytes)) {
                throw new GradleException("Runtime snapshot differs from compiled output: ${relative}")
            }
        }
        def runTask = tasks.named('runClient').get()
        bindDevRunSnapshot(runTask, first)
        def coordinates = "${mod_id}%%${first.absolutePath}".toString()
        if (runTask.getRunConfig().get().environment['MOD_CLASSES'] != coordinates
                || runTask.environment['MOD_CLASSES'] != coordinates) {
            throw new GradleException('ForgeGradle run config must retain the snapshot coordinates')
        }
        logger.lifecycle("Verified independent development snapshots ({} output files): {}", outputFiles.size(), first)
    }
}

tasks.configureEach {
    if (name in ['runClient', 'runClientFast', 'runClientCoverage', 'runClientJfr', 'runServer']) {
        dependsOn tasks.named('classes')
        doFirst { runTask ->
            def snapshot = createDevRunSnapshot()
            bindDevRunSnapshot(runTask, snapshot)
            logger.lifecycle('Development mod runtime snapshot: {}', snapshot)
        }
    }
}

def configureStableIdeRuns = {
    ['runClient', 'runServer'].each { runName ->
        def config = file(".idea/runConfigurations/${runName}.xml")
        config.parentFile.mkdirs()
        config.setText("""<component name="ProjectRunConfigurationManager">
  <configuration default="false" name="${runName}" type="GradleRunConfiguration" factoryName="Gradle">
    <ExternalSystemSettings>
      <option name="externalProjectPath" value="\$PROJECT_DIR\$" />
      <option name="externalSystemIdString" value="GRADLE" />
      <option name="taskNames"><list><option value="${runName}" /></list></option>
    </ExternalSystemSettings>
    <method v="2" />
  </configuration>
</component>
""", 'UTF-8')
    }
}
tasks.register('configureStableIdeRuns') {
    group = 'ide'
    description = 'Uses snapshot-backed Gradle tasks for IDEA development launches.'
    doLast { configureStableIdeRuns() }
}
tasks.configureEach {
    if (name == 'genIntellijRuns') doLast { configureStableIdeRuns() }
}
