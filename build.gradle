minecraft {
    mappings channel: mapping_channel, version: mapping_version
    runs {
        //开发环境
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            jvmArgs(
                    "-Xms4G",
                    "-Xmx6G",
                    "-XX:+UseG1GC",
                    "-XX:+ParallelRefProcEnabled",
                    "-XX:MaxGCPauseMillis=100",
                    "-XX:+UnlockExperimentalVMOptions",
                    "-XX:+DisableExplicitGC",
                    "-XX:G1NewSizePercent=20",
                    "-XX:G1MaxNewSizePercent=40",
                    "-XX:G1HeapRegionSize=8M",
                    "-XX:G1ReservePercent=20",
                    "-XX:InitiatingHeapOccupancyPercent=15"
            )
            mods {
                changede {
                    source sourceSets.main
                }
            }
        }
        server {
            def fissionChecks = providers.gradleProperty('verifyFission').getOrElse('false').toBoolean()
            def gasChecks = providers.gradleProperty('verifyGasTechnology').getOrElse('false').toBoolean()
            def gasWorld = providers.gradleProperty('omitMekanismForChecks').getOrElse('false').toBoolean() ? 'build/gas-optional-server' : 'build/gas-technology-server'
            workingDirectory project.file(gasChecks ? gasWorld : fissionChecks ? 'build/thermoelectric-server' : 'run')
            if (gasChecks) {
                property 'changede.verifyGasTechnology', 'true'
                jvmArgs '-Xms512M', '-Xmx2G'
            }
            if (fissionChecks) {
                property 'changede.verifyFission', 'true'
                jvmArgs '-Xms512M', '-Xmx2G'
            }
            args '--nogui'
            mods {
                changede {
                    source sourceSets.main
                }
            }
        }
    }
}
tasks.register('thermoelectricModelChecks', JavaExec) {
    group = 'verification'
    description = 'Checks thermoelectric heat conservation and operating limits.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'github.com.gengyoubo.CE.compat.mekanism.fission.ThermoelectricModelChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
tasks.register('dualEnergyProcessChecks', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'github.com.gengyoubo.CE.LP.DualEnergyProcessChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
if (providers.gradleProperty('verifyGasTechnology').getOrElse('false').toBoolean()) {
    def gasWorld = providers.gradleProperty('omitMekanismForChecks').getOrElse('false').toBoolean() ? 'build/gas-optional-server' : 'build/gas-technology-server'
    def gasReport = file(gasWorld + '/gas-checks.txt')
    tasks.matching { it.name == 'runServer' }.configureEach {
        doFirst { if (gasReport.exists()) gasReport.delete() }
        doLast {
            if (!gasReport.exists() || !gasReport.text.startsWith('PASS:'))
                throw new GradleException(gasReport.exists() ? gasReport.text : 'Gas verification did not produce a report')
        }
    }
}
tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            displayURL: displayURL,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}
tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation"
}
def mixinRefmapDir = "${buildDir}/tmp/compileJava"
jar {
    manifest {
        attributes([
                "Specification-Title": mod_name,
                "Specification-Vendor": mod_authors,
                "Specification-Version": mod_version,
                "Implementation-Title": mod_group_id,
                "Implementation-Version": project.version,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs": "mixins/changede.mixins.json,mixins/changede-proext.mixins.json,mixins/changede-lp.mixins.json,mixins/changede-diagnostics.mixins.json"
        ])}
    // 显式包含 resources 目录下的所有文件
    from(sourceSets.main.resources) {
        include 'mixins/**'      // 包含 mixins 目录
        include 'assets/**'      // 包含 assets 目录
        include 'META-INF/**'    // 包含 META-INF 目录
    }
    // 包含编译后的 class 文件
    from(sourceSets.main.output) {
        exclude '**/*.refmap.json'  // 排除 refmap，后面单独处理
    }
    // 包含 refmap 文件（确保它在正确的位置）
    from("${buildDir}/classes/java/main") {
        include '**/*.refmap.json'
    }
    from(mixinRefmapDir) {
        include '**/*.refmap.json'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    finalizedBy 'reobfJar'

    //模组名称
    archiveBaseName.set("changed-extra")
    //模组版本
    archiveVersion.set(mod_version)
    //模组分支(主分支为main)
    //archiveClassifier.set("b")
}
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
