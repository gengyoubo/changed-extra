// Uses only an isolated build-directory world; the probe is not part of regular builds.
gradle.beforeProject { project ->
    project.afterEvaluate {
        def probeDir=project.file('build/research-integration-source')
        project.copy {
            from project.file('tests/skill/ResearchIntegrationProbe.java')
            from project.file('tests/skill/MorphicCrystalIntegrationProbe.java')
            into probeDir
        }
        project.sourceSets.main.java.srcDir(probeDir)
        project.minecraft.runs.server.workingDirectory project.file('build/morphic-integration-run')
        project.minecraft.runs.server.jvmArgs '-Xmx4G'
        project.minecraft.runs.server.property 'forge.logging.console.level','info'
        project.minecraft.runs.server.property 'changede.integrationProbe','true'
    }
}
